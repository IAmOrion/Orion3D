[package]
name = "orion3d"
version = "0.1.0"
edition = "2024"
description = "Offline desktop 3D modeller in the spirit of Tinkercad"
publish = false

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37"
egui-wgpu = "0.37.0"
env_logger = "0.11.11"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
manifold-csg = { version = "0.4.1", default-features = false }
quick-xml = "0.42.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true

# Keep debug builds responsive: optimise dependencies (geometry, rendering).
[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
