name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            exe: orion3d.exe
            artifact: Orion3D-windows-x64
          - name: Linux
            os: ubuntu-latest
            exe: orion3d
            artifact: Orion3D-linux-x64
          - name: macOS
            os: macos-latest
            exe: orion3d
            artifact: Orion3D-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp "target/release/${{ matrix.exe }}" dist/
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" .
          else
            zip -r "../${{ matrix.artifact }}.zip" .
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
